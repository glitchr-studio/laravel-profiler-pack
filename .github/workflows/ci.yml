name: CI

on:
  push:
    branches: ['1.x']
  pull_request:
  workflow_dispatch:
  # release.yml runs this CI on a tag before the release.
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.*' }
          - { php: '8.4', laravel: '12.*' }
          - { php: '8.3', laravel: '13.*' }
          - { php: '8.4', laravel: '13.*' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Install
        run: >
          composer update --no-interaction --no-progress
          --with "laravel/framework:${{ matrix.laravel }}"
          --with "illuminate/support:${{ matrix.laravel }}"

      - name: Tests
        run: vendor/bin/phpunit
